plugins {
    id 'com.android.application'
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id 'kotlin-android'
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id 'dev.flutter.flutter-gradle-plugin'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    namespace = 'com.example.learn_flutter'
    compileSdk = 35
    ndkVersion = "27.0.12077973"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId = 'com.example.learn_flutter'
        minSdk = 24
        targetSdk = 35
        multiDexEnabled true
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    def keystoreFile = file("javalab.jks")
    signingConfigs {
        if (keystoreFile.exists()) {
            release {
                keyAlias "javalab"
                keyPassword "123456"
                storeFile keystoreFile
                storePassword "123456"
            }
        }
    }

    buildTypes {
        release {
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter {
    source = '../..'
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    // JavaCompileEngine dependencies
    implementation 'com.github.xiaoyvyv.JavaCompileEngine:library:1.1'
    implementation 'com.github.xiaoyvyv.JavaCompileEngine:dx:1.1'
}
